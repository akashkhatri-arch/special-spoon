<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akash Cyberpunk</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Orbitron', sans-serif;
    background: black;
    color: #00f7ff;
    overflow-x: hidden;
}

/* Animated background */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, #0f0c29, #302b63, #24243e);
    z-index: -2;
}

body::after {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,255,0.05) 0px,
        rgba(0,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px
    );
    animation: moveGrid 10s linear infinite;
    z-index: -1;
}

@keyframes moveGrid {
    from { transform: translateY(0); }
    to { transform: translateY(40px); }
}

/* Header */
header {
    text-align: center;
    padding: 30px;
    font-size: 28px;
    text-shadow: 0 0 10px cyan;
}

/* Menu */
nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

nav button {
    background: transparent;
    border: 2px solid #00f7ff;
    color: #00f7ff;
    padding: 10px 20px;
    cursor: pointer;
    transition: 0.3s;
    border-radius: 5px;
}

nav button:hover {
    background: #00f7ff;
    color: black;
    box-shadow: 0 0 20px #00f7ff;
}

/* Section */
section {
    text-align: center;
    padding: 80px 20px;
}

h1 {
    font-size: 40px;
    text-shadow: 0 0 20px #00f7ff;
}

/* Glitch effect */
.glitch {
    position: relative;
    display: inline-block;
}

.glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
}

.glitch::before {
    animation: glitch1 1s infinite;
    color: red;
    z-index: -1;
}

.glitch::after {
    animation: glitch2 1s infinite;
    color: blue;
    z-index: -2;
}

@keyframes glitch1 {
    0% { transform: translate(0); }
    20% { transform: translate(-2px,2px); }
    40% { transform: translate(-2px,-2px); }
    60% { transform: translate(2px,2px); }
    80% { transform: translate(2px,-2px); }
    100% { transform: translate(0); }
}

@keyframes glitch2 {
    0% { transform: translate(0); }
    20% { transform: translate(2px,-2px); }
    40% { transform: translate(2px,2px); }
    60% { transform: translate(-2px,-2px); }
    80% { transform: translate(-2px,2px); }
    100% { transform: translate(0); }
}

/* Footer */
footer {
    text-align: center;
    padding: 20px;
    font-size: 14px;
    opacity: 0.7;
}

/* Responsive */
@media (max-width: 600px) {
    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header>
    ⚡ AKASH CYBER SYSTEM ⚡
</header>

<nav>
    <button onclick="playSound()">Home</button>
    <button onclick="playSound()">About</button>
    <button onclick="playSound()">Projects</button>
    <button onclick="playSound()">Contact</button>
</nav>

<section>
    <h1 class="glitch" data-text="WELCOME AKASH">WELCOME AKASH</h1>
    <p>Cyberpunk Interface Initialized...</p>
</section>

<footer>
    © 2026 Akash | Cyber Mode Active
</footer>

<!-- Audio -->
<audio id="hoverSound" src="https://assets.mixkit.co/sfx/preview/mixkit-interface-click-1126.mp3"></audio>

<script>
const sound = document.getElementById("hoverSound");

// Play on click
function playSound() {
    sound.currentTime = 0;
    sound.play();
}

// Play on hover (desktop)
document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("mouseenter", () => {
        sound.currentTime = 0;
        sound.play();
    });
});

// Mobile tap feedback
document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("touchstart", () => {
        sound.currentTime = 0;
        sound.play();
    });
});
</script>

</body>
</html>
